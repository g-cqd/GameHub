# swift-mutation-testing: every test target against mutants of the code Wine runs (HubRules). `swift package quality
# mutation` runs it over all of it, on the efficiency cores; the pre-push hook over what a push changes.
timeout: 120
output: .build/mutation-report.json
markdown-output: .build/mutation-summary.md
# Only the libraries are mutated: the executables are thin host tools, and the tests, plugins and corpus are not shipped.
exclude:
  - "/Tests/"
  - "/Plugins/"
  - "/Differential/"
  - "/winekit-quality/"
  - "/QualityKit/"
operator-tier: default
