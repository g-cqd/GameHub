# project-hooks (github.com/g-cqd/project-hooks): custom tasks run only in a trusted repository
# (git config project-hooks.trusted true).
#
# WineKit's gates, scoped to what the commit or the push changes in winekit/: format and lint read the changed Swift files,
# the analyzers report only them. Pushes also run mutation testing on the changed HubRules sources, at background
# priority on the efficiency cores; commits don't wait for it (QualityKit's Hook).
# --disable-sandbox: swift-mutation-testing and the nested test builds run SwiftPM, whose manifest sandbox can't nest
# inside the plugin's.
pre-commit:
  tasks:
    - name: winekit
      run: "cd winekit && WINEKIT_DEV=1 swift package --disable-sandbox quality changed pre-commit"
      on-files: ["winekit/*"]
      timeout: 3600

pre-push:
  tasks:
    - name: winekit
      run: "cd winekit && WINEKIT_DEV=1 swift package --disable-sandbox quality changed pre-push"
      on-files: ["winekit/*"]
      timeout: 3600
