# DXMT settings for GTA5.exe (GTA V). `hub` passes this file to that process only (DXMT_CONFIG_FILE in a compat rule);
# DXMT reads it every time the game starts, so edit it, quit the game and start it again. Syntax: `dxmt.conf` in the DXMT
# source tree (`key = value`, `[Program.exe]` sections, `#` comments).
#
# Symptoms seen on this setup (M2 Pro, 16 GB, DXMT through hub-1): black outlines around shapes, very dark or black
# textures and effects, textures that load, unload and load again. See docs/hub/gtav-graphics.md for what was ruled in
# and out, and how to test one change at a time.

[GTA5.exe]
# First experiment for the black outlines and black effects: NaN or infinite values reaching a texture sample or a
# fused multiply-add give black pixels on Apple GPUs. These two options make DXMT's converted shaders tolerate them.
# Not verified to help GTA V; turn both off (set False) to compare.
d3d11.sampleNaNToZero = True
d3d11.defuseFma = True

# Tried against the "Undefined symbols: llvm.agx2.sample.itrproj.1xf" pixel-shader failures: it did NOT remove them (same
# shaders failed again with the option on), so it is off. Needs the dxmt build on branch gtav-precise-divide.
d3d11.preciseDivide = False

# Memory: the 2026-10-24 watch log shows swap growing from 6.9 GB to 11.4 GB within six minutes of play, which fits the textures
# that load, unload and load again. Tell the game it has 4 GiB of video memory instead of 6.36 GiB (a DXMT build with
# dxgi.maxDeviceMemory is needed; older builds ignore the line). Off by default: with the game on DirectX 10.1 the memory problem was not seen.
# dxgi.maxDeviceMemory = 4096

# Other knobs worth one test each:
# d3d11.maxTessFactor = 16       # the game's tessellation is "Very High"; a lower cap costs little image quality
# dxgi.forceSDR = True           # in case the XDR panel's HDR path darkens the picture
# d3d11.preferredMaxFrameRate = 60
