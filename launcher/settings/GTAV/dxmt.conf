# DXMT settings for GTA5.exe (GTA V). `hub` passes this file to that process only (DXMT_CONFIG_FILE in a compat rule);
# DXMT reads it every time the game starts, so edit it, quit the game and start it again. Syntax: `dxmt.conf` in the DXMT
# source tree (`key = value`, `[Program.exe]` sections, `#` comments).
#
# Symptoms seen on this setup (M2 Pro, 16 GB, DXMT through hub-1): black outlines around shapes, very dark or black
# textures and effects, textures that load, unload and load again. See docs/hub/gtav-graphics.md for what was ruled in
# and out, and how to test one change at a time.

[GTA5.exe]
# First experiment for the black outlines and black effects: NaN or infinite values reaching a texture sample or a
# fused multiply-add give black pixels on Apple GPUs. These two options make DXMT's converted shaders tolerate them.
# Both on (flags 3, 21:41): no black effects, but the screen flashed white now and then. NaN-to-zero only (flags 1, 21:58): no
# PSO failure and one white flash in about five minutes. So NaN-to-zero is what is needed; FMA stays off.
d3d11.sampleNaNToZero = True
d3d11.defuseFma = False

# Run of 2026-10-24 22:19 (flags 1): no black effects, but magenta and white lattices of thin lines appeared on exhaust smoke,
# on the hands on the steering wheel and on dirt (screenshots 22:21:43 and 22:22:16). Same lines the black outlines were before:
# pixels where a lighting or particle pass computes garbage. Strict math for pixel and compute shaders (flags 9, 22:37) did NOT
# remove them, so it is off again (it costs speed):
d3d11.strictMath = False

# MSAA bisect result (2026-10-25 00:20): dropping these three per-sample light-volume shaders did NOT remove the magenta/white
# lattices and brought back dark strokes and dark textures (those draws are the lighting). Not the culprit; off.
# debug.skipPixelShaders = dc953feb,636d2c37,673de1c7

# Not needed so far: with only the two options above (flags 3) the run of 2026-10-24 21:41 logged no
# "Undefined symbols: llvm.agx2.sample.itrproj.1xf" failure. Kept as a fallback for those pixel-shader failures. The failing shaders are the deferred
# lighting passes: they sample a texture at `position.xy / position.w` of a sample-rate interpolant, which Apple's compiler
# turns into a projective sample it cannot link. An exact divide may stop that. The first test of this option on
# 2026-10-24 proved nothing: the settings file was not being read (see docs/hub/gtav-graphics.md). Needs the dxmt build on
# branch gtav-precise-divide.
d3d11.preciseDivide = False

# Memory: the 2026-10-24 watch log shows swap growing from 6.9 GB to 11.4 GB within six minutes of play, which fits the textures
# that load, unload and load again. Tell the game it has 4 GiB of video memory instead of 6.36 GiB (a DXMT build with
# dxgi.maxDeviceMemory is needed; older builds ignore the line). Off for the A/B test of the pop-in (textures late, map visible through buildings): the cap lowers the game's streaming budget.
# dxgi.maxDeviceMemory = 4096

# Other knobs worth one test each:
# d3d11.maxTessFactor = 16       # the game's tessellation is "Very High"; a lower cap costs little image quality
# dxgi.forceSDR = True           # in case the XDR panel's HDR path darkens the picture
# d3d11.preferredMaxFrameRate = 60
